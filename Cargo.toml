[package]
name = "openspore"
version = "0.73.0"
edition = "2021"
description = "OpenSpore - open-source Bevy engine that requires the original Spore assets (OpenRCT2 model)"
license = "GPL-3.0-or-later"
default-run = "openspore"

[dependencies]
bevy = { version = "0.20", features = ["wav"] }
puremp3 = "0.1"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
sha2 = "0.10"
png = "0.18.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D9", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

